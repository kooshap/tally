# swift-format owns layout: indentation, line length, commas, and where braces
# go. SwiftLint checks everything else. The rules below would otherwise flag
# the formatter's own output.
included:
  - Tally
  - TallyTests
  - TallyUITests

disabled_rules:
  - line_length # swift-format wraps code at 120; what's left is string literals
  - trailing_comma # swift-format adds them to multi-line collections

# Opt-in rules about meaning, not layout. Left off on purpose:
# redundant_type_annotation (@Model properties need their types spelled out)
# and unused_parameter (fires on protocol conformances like XMLParserDelegate).
opt_in_rules:
  # Collections
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - reduce_into
  - sorted_first_last
  # Idioms
  - discouraged_assert
  - fatal_error_message
  - legacy_multiple
  - prefer_condition_list
  - prefer_key_path
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - return_value_from_void_function
  - shorthand_optional_binding
  - toggle_bool
  # Likely bugs
  - async_without_await
  - force_unwrapping # off again in the test targets' own configs
  - identical_operands
  - implicitly_unwrapped_optional # likewise
  - lower_acl_than_parent
  - unhandled_throwing_task
  - unneeded_escaping
  - unowned_variable_capture
  # SwiftUI
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - private_swiftui_state
  # Tests
  - empty_xctest_method
  - final_test_case
  - test_case_accessibility
  - xct_specific_matcher

# Run by `swiftlint analyze`, which reads a full xcodebuild log; `lint` skips
# them. CI's lint job does this. unused_declaration is left off because it flags
# @State that's only read through its `$` binding.
analyzer_rules:
  - capture_variable
  - unused_import

opening_brace:
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true
