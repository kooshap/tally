# swift-format owns layout: indentation, line length, commas, and where braces
# go. SwiftLint checks everything else. The rules below would otherwise flag
# the formatter's own output.
included:
  - Tally
  - TallyTests
  - TallyUITests

disabled_rules:
  - line_length # swift-format wraps code at 120; what's left is string literals
  - trailing_comma # swift-format adds them to multi-line collections

# Opt-in rules about meaning, not layout. Left off on purpose:
# implicitly_unwrapped_optional (idiomatic in tests), redundant_type_annotation
# (@Model properties need their types spelled out), and unused_parameter (fires
# on protocol conformances like XMLParserDelegate).
opt_in_rules:
  # Collections
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - first_where
  - last_where
  - sorted_first_last
  # Idioms
  - fatal_error_message
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - shorthand_optional_binding
  - toggle_bool
  # Likely bugs
  - force_unwrapping # off again in the test targets' own configs
  - identical_operands
  - unhandled_throwing_task
  - unowned_variable_capture
  # SwiftUI
  - accessibility_label_for_image
  - private_swiftui_state
  # Tests
  - empty_xctest_method
  - final_test_case
  - xct_specific_matcher

# Run by `swiftlint analyze`, which reads a full xcodebuild log; `lint` skips
# them. CI's lint job does this. unused_declaration is left off because it flags
# @State that's only read through its `$` binding.
analyzer_rules:
  - unused_import

opening_brace:
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true
