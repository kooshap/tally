name: CI

on:
  push:

permissions:
  contents: read

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: macos-26
    timeout-minutes: 20
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # swift-format is built from source with this Xcode's compiler.
      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP"

      # The tools are pinned in BuildTools/, so a new release upstream can't
      # fail a commit that changed nothing. Building swift-format takes a few
      # minutes, hence the cache; changing a pin changes the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            BuildTools/.build
            BuildTools/.bin
          key: buildtools-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('BuildTools/Package.swift', 'BuildTools/Package.resolved', 'BuildTools/tool') }}

      - name: Show tool versions
        run: |
          echo "swift-format $(BuildTools/tool swift-format --version)"
          echo "SwiftLint $(BuildTools/tool swiftlint version)"

      - name: Check formatting
        run: BuildTools/tool swift-format lint --strict --recursive --parallel Tally TallyTests TallyUITests

      - name: Lint
        run: BuildTools/tool swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Unit and UI tests
    # Pinned rather than macos-latest, so a runner image change can't
    # silently swap the Xcode the app builds with.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version

      # Tally.xcodeproj is generated and gitignored; project.yml is the source.
      - name: Generate the Xcode project
        run: BuildTools/tool xcodegen generate

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme Tally \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Report coverage
        if: ${{ !cancelled() && hashFiles('TestResults.xcresult/**') != '' }}
        run: |
          {
            echo '### Code coverage'
            echo '```'
            xcrun xccov view --report --only-targets TestResults.xcresult
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the result bundle
        if: ${{ failure() && hashFiles('TestResults.xcresult/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
