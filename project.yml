name: Tally
options:
  bundleIdPrefix: com.kooshap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - path: Tally
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Tally
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # No networking of any kind: declare no ATS exceptions, claim no encryption.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kooshap.tally
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  TallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TallyTests
    dependencies:
      - target: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kooshap.tally.tests

schemes:
  Tally:
    build:
      targets:
        Tally: all
    test:
      targets:
        - TallyTests
