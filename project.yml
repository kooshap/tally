name: Tally
options:
  bundleIdPrefix: com.kooshap
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5CXRXAQ8VY

targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - path: Tally
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleLocalizations: [en, de]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Unlocks Tally so your balances stay private if someone else picks up your phone.
        # The only host the app ever contacts is the ECB, over HTTPS.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kooshap.tally
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  TallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TallyTests
    dependencies:
      - target: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kooshap.tally.tests

  TallyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TallyUITests
    dependencies:
      - target: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kooshap.tally.uitests

schemes:
  Tally:
    build:
      targets:
        Tally: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - Tally
      targets:
        - TallyTests
        - TallyUITests
