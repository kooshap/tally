# Fast checks on the Swift files being committed; `lefthook install` turns
# them on. The test suite is too slow for a hook and runs in CI instead.
pre-commit:
  commands:
    format:
      glob: "*.swift"
      run: swift-format format --in-place {staged_files}
      stage_fixed: true
    lint:
      glob: "*.swift"
      run: swiftlint lint --strict --quiet {staged_files}
